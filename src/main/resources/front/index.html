<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>دفتر سفارش — نمایش عمق</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="css/orderbook.css" rel="stylesheet">
</head>
<body class="ob-body">
<nav class="navbar navbar-dark ob-nav border-bottom border-secondary">
    <div class="container-fluid">
        <span class="navbar-brand mb-0 h1">HFT Order Book — دمو</span>
        <span class="text-secondary small" id="status-text">در حال بارگذاری…</span>
    </div>
</nav>

<main class="container-fluid py-3">
    <div class="row g-3">
        <div class="col-lg-8">
            <div class="card ob-card h-100">
                <div class="card-header d-flex justify-content-between align-items-center">
                    <span>عمق بازار</span>
                    <div class="d-flex gap-2 align-items-center">
                        <label class="form-check-label small text-secondary">
                            <input class="form-check-input me-1" type="checkbox" id="auto-refresh" checked>
                            بروزرسانی خودکار
                        </label>
                        <button type="button" class="btn btn-sm btn-outline-info" id="btn-refresh">بروزرسانی</button>
                        <button type="button" class="btn btn-sm btn-outline-warning" id="btn-seed">دادهٔ نمونه</button>
                    </div>
                </div>
                <div class="card-body p-0">
                    <div class="ob-summary row g-0 text-center border-bottom border-secondary">
                        <div class="col"><span class="ob-label">بهترین خرید</span><div id="stat-bid" class="ob-stat ob-bid">—</div></div>
                        <div class="col"><span class="ob-label">میانه</span><div id="stat-mid" class="ob-stat">—</div></div>
                        <div class="col"><span class="ob-label">بهترین فروش</span><div id="stat-ask" class="ob-stat ob-ask">—</div></div>
                        <div class="col"><span class="ob-label">اسپرد</span><div id="stat-spread" class="ob-stat">—</div></div>
                        <div class="col"><span class="ob-label">سفارش باز</span><div id="stat-open" class="ob-stat">—</div></div>
                    </div>
                    <div class="ob-ladder-header row g-0 small text-secondary border-bottom border-secondary">
                        <div class="col-4 text-end pe-3">حجم</div>
                        <div class="col-4 text-center">قیمت</div>
                        <div class="col-4 text-start ps-3">حجم</div>
                    </div>
                    <div id="depth-ladder" class="ob-ladder"></div>
                </div>
            </div>
        </div>

        <div class="col-lg-4">
            <div class="card ob-card mb-3" id="last-result-card" style="display:none">
                <div class="card-header py-2">آخرین نتیجه</div>
                <div class="card-body py-2 small" id="last-result-body"></div>
            </div>

            <div class="card ob-card mb-3">
                <div class="card-header">ثبت سفارش (Submit)</div>
                <div class="card-body">
                    <form id="order-form">
                        <div class="mb-2">
                            <label class="form-label">طرف</label>
                            <select class="form-select form-select-sm ob-input" id="side" name="side">
                                <option value="BUY">خرید (Bid)</option>
                                <option value="SELL">فروش (Ask)</option>
                            </select>
                        </div>
                        <div class="row g-2 mb-2">
                            <div class="col-6">
                                <label class="form-label">قیمت</label>
                                <input type="number" class="form-control form-control-sm ob-input" id="price" min="1" value="100" required>
                            </div>
                            <div class="col-6">
                                <label class="form-label">حجم</label>
                                <input type="number" class="form-control form-control-sm ob-input" id="quantity" min="1" value="10" required>
                            </div>
                        </div>
                        <div class="mb-2">
                            <label class="form-label">شناسه (اختیاری)</label>
                            <input type="number" class="form-control form-control-sm ob-input" id="order-id" min="1" placeholder="خودکار">
                        </div>
                        <button type="submit" class="btn btn-primary btn-sm w-100">ارسال</button>
                    </form>
                </div>
            </div>

            <div class="card ob-card mb-3">
                <div class="card-header d-flex justify-content-between">
                    <span>معاملات اخیر</span>
                    <button type="button" class="btn btn-sm btn-outline-secondary" id="btn-trades">بارگذاری</button>
                </div>
                <div class="card-body p-0">
                    <ul class="list-group list-group-flush ob-trades" id="trade-list"></ul>
                </div>
            </div>

            <div class="card ob-card mb-3">
                <div class="card-header">جستجو و وضعیت سفارش</div>
                <div class="card-body">
                    <form id="lookup-form" class="d-flex gap-2 mb-2">
                        <input type="number" class="form-control form-control-sm ob-input" id="lookup-id" min="1" placeholder="شناسه" required>
                        <button type="submit" class="btn btn-outline-info btn-sm">جستجو</button>
                    </form>
                    <div id="order-detail" class="ob-order-detail text-secondary small">
                        شناسه را وارد کنید تا وضعیت چرخهٔ سفارش نمایش داده شود.
                    </div>
                </div>
            </div>

            <div class="card ob-card mb-3">
                <div class="card-header">جایگزینی (Replace)</div>
                <div class="card-body">
                    <form id="replace-form">
                        <div class="mb-2">
                            <label class="form-label">شناسهٔ سفارش باز</label>
                            <input type="number" class="form-control form-control-sm ob-input" id="replace-open-id" min="1" required>
                        </div>
                        <div class="row g-2 mb-2">
                            <div class="col-6">
                                <label class="form-label">قیمت جدید</label>
                                <input type="number" class="form-control form-control-sm ob-input" id="replace-price" min="1" required>
                            </div>
                            <div class="col-6">
                                <label class="form-label">حجم جدید</label>
                                <input type="number" class="form-control form-control-sm ob-input" id="replace-qty" min="1" required>
                            </div>
                        </div>
                        <div class="mb-2">
                            <label class="form-label">شناسهٔ جدید (اختیاری)</label>
                            <input type="number" class="form-control form-control-sm ob-input" id="replace-new-id" min="1" placeholder="خودکار">
                        </div>
                        <button type="submit" class="btn btn-warning btn-sm w-100">جایگزین کن</button>
                    </form>
                </div>
            </div>

            <div class="card ob-card">
                <div class="card-header">لغو سفارش</div>
                <div class="card-body">
                    <form id="cancel-form" class="d-flex gap-2">
                        <input type="number" class="form-control form-control-sm ob-input" id="cancel-id" min="1" placeholder="شناسه" required>
                        <button type="submit" class="btn btn-outline-danger btn-sm">لغو</button>
                    </form>
                    <div id="msg" class="small mt-2 text-info" style="display:none"></div>
                </div>
            </div>
        </div>
    </div>
</main>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/orderbook.js"></script>
</body>
</html>
