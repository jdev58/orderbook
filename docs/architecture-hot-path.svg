<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 320" width="880" height="320" role="img" aria-labelledby="arch-title">
  <title id="arch-title">Order book hot path</title>
  <rect width="880" height="320" fill="#f8fafc"/>
  <text x="24" y="36" fill="#0f172a" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="600">Matching hot path (simplified)</text>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#475569"/>
    </marker>
  </defs>
  <rect x="24" y="72" width="140" height="56" rx="8" fill="#dbeafe" stroke="#2563eb"/>
  <text x="94" y="105" text-anchor="middle" fill="#1e3a8a" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="600">Submit</text>
  <line x1="164" y1="100" x2="204" y2="100" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="204" y="72" width="150" height="56" rx="8" fill="#ccfbf1" stroke="#0d9488"/>
  <text x="279" y="96" text-anchor="middle" fill="#134e4a" font-family="Segoe UI, system-ui, sans-serif" font-size="12" font-weight="600">MatchingEngine</text>
  <text x="279" y="112" text-anchor="middle" fill="#134e4a" font-family="Segoe UI, system-ui, sans-serif" font-size="11">match while crossed</text>
  <line x1="354" y1="100" x2="394" y2="100" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="394" y="72" width="160" height="56" rx="8" fill="#ede9fe" stroke="#7c3aed"/>
  <text x="474" y="96" text-anchor="middle" fill="#4c1d95" font-family="Segoe UI, system-ui, sans-serif" font-size="12" font-weight="600">OrderBook</text>
  <text x="474" y="112" text-anchor="middle" fill="#4c1d95" font-family="Segoe UI, system-ui, sans-serif" font-size="11">TreeMap + FIFO</text>
  <line x1="554" y1="100" x2="594" y2="100" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="594" y="72" width="130" height="56" rx="8" fill="#fef3c7" stroke="#ca8a04"/>
  <text x="659" y="105" text-anchor="middle" fill="#713f12" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="600">Trades / rest</text>
  <rect x="48" y="168" width="784" height="120" rx="10" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="72" y="196" fill="#334155" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="600">In-memory structures</text>
  <rect x="72" y="212" width="220" height="56" rx="6" fill="#f1f5f9"/>
  <text x="182" y="234" text-anchor="middle" fill="#475569" font-family="Segoe UI, system-ui, sans-serif" font-size="12">bids / asks TreeMap</text>
  <text x="182" y="252" text-anchor="middle" fill="#64748b" font-family="Segoe UI, system-ui, sans-serif" font-size="11">price ’ PriceLevel</text>
  <rect x="320" y="212" width="220" height="56" rx="6" fill="#f1f5f9"/>
  <text x="430" y="234" text-anchor="middle" fill="#475569" font-family="Segoe UI, system-ui, sans-serif" font-size="12">PriceLevel FIFO</text>
  <text x="430" y="252" text-anchor="middle" fill="#64748b" font-family="Segoe UI, system-ui, sans-serif" font-size="11">intrusive Order links</text>
  <rect x="568" y="212" width="240" height="56" rx="6" fill="#f1f5f9"/>
  <text x="688" y="234" text-anchor="middle" fill="#475569" font-family="Segoe UI, system-ui, sans-serif" font-size="12">Long2ObjectHashMap</text>
  <text x="688" y="252" text-anchor="middle" fill="#64748b" font-family="Segoe UI, system-ui, sans-serif" font-size="11">order id lookup (Agrona)</text>
</svg>